name: Deploy to Cloudflare Pages

# Direct-upload deploy model, matching wizard-web's: this workflow is the single
# deploy path for this site, and Cloudflare's Git integration is turned off for
# the project (§4 — exactly one deploy path).
#
#   push to main   → production deployment
#   pull_request   → preview deployment (branch alias)
#
# Without a CLOUDFLARE_API_TOKEN secret the deploy step skips green rather than
# failing. That is deliberate: this file can land before the secret exists, and
# can never race a still-enabled Git integration.
#
# A runner only ever has committed content, so --commit-dirty=false is honest
# here in a way hand-run `wrangler pages deploy` was not.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN   Cloudflare Pages:Edit on the TechGuyWithABeard account

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the deploy credential
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN — skipping deploy (see the header)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.ok == 'true'
        with:
          # No .nvmrc or engines field in this repo — pin explicitly rather than
          # let setup-node fail on a file that does not exist.
          node-version: '22'
      # PUBLIC_TURNSTILE_SITEKEY is read by ContactForm.astro at BUILD time. Without
      # it the component renders its plain-text fallback instead of the widget —
      # silently, with a green build. Cloudflare Pages supplied this as a project
      # env var when Pages built the site; moving the build into Actions (§4) left
      # it behind, which is how tomatick.us/contact/ lost its form.
      - name: Build
        if: steps.gate.outputs.ok == 'true'
        working-directory: site
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.PUBLIC_TURNSTILE_SITEKEY }}
        run: npm ci && npm run build

      # A green build is not evidence the form shipped: the fallback path builds
      # and deploys perfectly happily. Assert the OUTCOME, after the last step that
      # can rebuild dist/ and immediately before deploy. Mirrors the guard
      # wizard-web added on 2026-08-03 after all five wizard sites lost their form
      # the same way.
      #
      # Only meaningful once the secret exists: without it the fallback is correct
      # behaviour, not a fault, so this skips rather than lying.
      - name: Preflight — the built contact page carries the Turnstile widget
        if: steps.gate.outputs.ok == 'true'
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.PUBLIC_TURNSTILE_SITEKEY }}
        run: |
          if [ -z "${PUBLIC_TURNSTILE_SITEKEY:-}" ]; then
            echo "PUBLIC_TURNSTILE_SITEKEY not configured — fallback form is expected; skipping."
            exit 0
          fi
          PAGE="site/dist/contact/index.html"
          if [ ! -f "$PAGE" ]; then
            echo "::error::$PAGE was not built — cannot verify the contact form."
            exit 1
          fi
          if ! grep -q 'cf-turnstile' "$PAGE"; then
            grep -o 'contact form is being set up' "$PAGE" | head -1
            echo "::error::built the FALLBACK contact form: the site key did not reach the build, so the deployed form would 403 every submission. Refusing to deploy."
            exit 1
          fi
          echo "$PAGE carries the Turnstile widget."

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '8a0d49b1f3fdcdadec135562ec8a4fdc' }}
        run: >
          npx wrangler@4 pages deploy site/dist
          --project-name tomatick
          --branch ${{ github.ref == 'refs/heads/main' && 'main' || github.head_ref }}
          --commit-dirty=false
