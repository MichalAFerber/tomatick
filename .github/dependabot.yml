# TGWAB dependency updates—DEV-STANDARDS §15.
#
# Place at:  .github/dependabot.yml
#
# Grouping caps a normal week at ~3 PRs instead of one per package—ungrouped
# Dependabot is how automated updates get muted and then ignored.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-non-major:
        patterns: ["*"]
        update-types: [minor, patch]
      pip-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    # Supply-chain filter: malicious versions are typically yanked within hours.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Tailwind 3 -> 4 is a breaking rewrite (new engine, CSS-first config).
    # Treat it as scheduled work, not a Dependabot merge. Security updates for
    # tailwindcss are UNAFFECTED by this ignore and will still open a PR.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

    groups:
      npm-non-major:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
